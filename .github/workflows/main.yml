name: Extract Project ZIP

on:
  push:
    paths:
      - "manga-translator.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/project
          unzip -q manga-translator.zip -d /tmp/project
          cp -a /tmp/project/manga-translator-android-main/. .

      - name: Remove ZIP
        run: rm -f manga-translator.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract manga translator project"
          git push
